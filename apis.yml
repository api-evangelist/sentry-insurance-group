description: Sentry Insurance is a US mutual insurance holding company headquartered in Stevens Point,
  Wisconsin, writing commercial property and casualty insurance, workers' compensation, business auto
  and trucking coverage, group life and health, annuities and 401(k) retirement plans for businesses and
  individuals. Its personal-lines brand is Dairyland, acquired in 1966, which writes non-standard auto
  and motorcycle policies, and the group agreed to acquire The General from American Family Insurance.
  Sentry holds an AM Best Financial Strength Rating of A+ (Superior) and also operates SentryWorld, a
  golf and event venue. Sentry Insurance publishes no public API, developer portal or machine-readable
  product contract; business is transacted through appointed independent agents and authenticated customer
  portals. Not to be confused with Sentry (Functional Software, Inc.) at sentry.io, the unrelated application
  error-monitoring company.
