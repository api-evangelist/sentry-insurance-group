source: live anonymous GET of /.well-known/* on every Sentry Insurance host reachable from apis.yml and the sentry.com portal pages
note: >-
  Sentry Insurance publishes no developer portal and no product API, but its customer/agent
  sign-in is an Okta-hosted OpenID Connect tenant on its OWN domain (account.sentry.com),
  and that tenant serves RFC 8414 / OpenID Connect Discovery metadata anonymously. Those
  three documents are the only machine-readable API artifacts the company serves. They
  describe the identity provider that fronts insight.sentry.com, NOT a business API —
  the token they issue is only usable against Sentry's own first-party portal clients.
  Every /.well-known/ path on the marketing hosts (www.sentry.com, www.dairylandinsurance.com)
  and on quickpay.sentry.com returns a 404 HTML page.
